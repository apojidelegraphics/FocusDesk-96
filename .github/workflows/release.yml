name: Release

# Push a tag like v1.0.0 to build installers for all three platforms
# and attach them to a DRAFT GitHub release for you to review and publish.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,   os: macos-latest,   script: "build:mac",   files: "dist/*.dmg" }
          - { name: Windows, os: windows-latest, script: "build:win",   files: "dist/*.exe" }
          - { name: Linux,   os: ubuntu-latest,  script: "build:linux", files: "dist/*.AppImage" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches package.json
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # builds are intentionally unsigned
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check both Mac installers were built
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          ls -la dist/*.dmg
          ls dist/*-arm64.dmg dist/*-x64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  browser:
    name: Browser version (zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the browser-version zip
        shell: bash
        run: |
          VER=$(grep -oP 'var VERSION_BROWSER = "\K[^"]+' focusdesk.js)
          DIR="FocusDesk-96-Browser-$VER"
          mkdir -p "$DIR" dist
          cp focusdesk.js focusdesk.css apojilogo.js "$DIR"/
          # same page, minus the desktop-only script tag
          grep -v 'focusdesk-desk.js\|Desktop edition only' index.html > "$DIR/index.html"
          sed "s/__VERSION__/$VER/g" scripts/browser-readme.txt > "$DIR/READ ME FIRST.txt"
          zip -r "dist/$DIR.zip" "$DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-Browser
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Draft release
    needs: [build, browser]
    # still make the draft if one platform failed, so the others aren't lost (the failed job stays red)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: What is attached
        shell: bash
        run: |
          ls -la dist || true
          for pat in "*-arm64.dmg" "*-x64.dmg" "*.exe" "*.AppImage" "*.zip"; do
            if ! ls dist/$pat >/dev/null 2>&1; then
              echo "::warning::No $pat file was built, so it is missing from this draft release. Open the failed job to see why."
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/*
