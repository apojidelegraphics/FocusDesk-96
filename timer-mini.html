<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FocusDesk Timer</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
      body { background: #c0c0c0; font: 12px Tahoma, "Segoe UI", Arial, sans-serif; }
      #pill {
        height: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px 0 8px;
        border: 2px solid;
        border-color: #fff #404040 #404040 #fff;
        outline: 1px solid #000;
        cursor: grab;
      }
      #pill.dragging { cursor: grabbing; }
      #grip { color: #808080; font-size: 15px; letter-spacing: -2px; line-height: 1; width: 12px; flex: none; overflow: hidden; white-space: nowrap; }
      #time {
        font: bold 24px "Courier New", monospace;
        flex: none;
        min-width: 88px;
        padding: 3px 8px;
        background: #000;
        color: #0f0;
        border: 2px solid;
        border-color: #404040 #fff #fff #404040;
        text-align: center;
      }
      #time.break { color: #6cf; }
      #time.paused { color: #fc0; }
      #meta { flex: 1; min-width: 54px; display: flex; flex-direction: column; gap: 3px; }
      #mode { font-weight: bold; color: #000080; font-size: 13px; white-space: nowrap; }
      #state { color: #404040; font-size: 11px; white-space: nowrap; }
      #btns { display: flex; gap: 5px; flex: none; }
      button {
        font: bold 13px Tahoma, Arial, sans-serif;
        width: 28px;
        height: 28px;
        padding: 0;
        background: #c0c0c0;
        border: 2px solid;
        border-color: #fff #404040 #404040 #fff;
        cursor: default;
      }
      button:active { border-color: #404040 #fff #fff #404040; }
    </style>
  </head>
  <body>
    <div id="pill" title="Drag to move. Double-click to open FocusDesk.">
      <div id="grip">&#8942;&#8942;</div>
      <div id="time">--:--</div>
      <div id="meta"><div id="mode">Timer</div><div id="state">&nbsp;</div></div>
      <div id="btns">
        <button id="go" title="Start / pause">&#9654;</button>
        <button id="rst" title="Reset">&#8634;</button>
        <button id="x" title="Close">&#10005;</button>
      </div>
    </div>
    <script>
      var time = document.getElementById("time"), mode = document.getElementById("mode"), state = document.getElementById("state"), go = document.getElementById("go"), pill = document.getElementById("pill");
      function mmss(s) { s = Math.max(0, Math.floor(s)); return ("0" + Math.floor(s / 60)).slice(-2) + ":" + ("0" + (s % 60)).slice(-2); }
      function paint(t) {
        if (!t) return;
        time.textContent = mmss(t.left);
        time.className = t.running ? (t.mode === "focus" ? "" : "break") : t.paused ? "paused" : "";
        mode.textContent = t.mode === "focus" ? "Focus" : "Break";
        state.textContent = t.running ? "running" : t.paused ? "paused" : "ready";
        go.innerHTML = t.running ? "&#10074;&#10074;" : "&#9654;";
      }
      window.auxApi.on("mini:status", paint);
      go.onclick = function () { window.auxApi.send("mini:cmd", "toggle"); };
      document.getElementById("rst").onclick = function () { window.auxApi.send("mini:cmd", "reset"); };
      document.getElementById("x").onclick = function () { window.auxApi.send("mini:cmd", "close"); };
      pill.ondblclick = function (e) { if (!e.target.closest("button")) window.auxApi.send("mini:cmd", "open"); };
      /* Dragging is done here (not with the CSS drag region) so it works the same on every system. */
      (function () {
        var drag = null;
        pill.addEventListener("pointerdown", function (e) {
          if (e.button !== 0 || e.target.closest("button")) return;
          drag = { sx: e.screenX, sy: e.screenY, wx: window.screenX, wy: window.screenY };
          try { pill.setPointerCapture(e.pointerId); } catch (x) {}
          pill.classList.add("dragging");
          e.preventDefault();
        });
        pill.addEventListener("pointermove", function (e) {
          if (drag) window.auxApi.send("win:move", { x: drag.wx + e.screenX - drag.sx, y: drag.wy + e.screenY - drag.sy });
        });
        function end(e) {
          if (!drag) return;
          drag = null;
          pill.classList.remove("dragging");
          try { pill.releasePointerCapture(e.pointerId); } catch (x) {}
        }
        pill.addEventListener("pointerup", end);
        pill.addEventListener("pointercancel", end);
      })();
    </script>
  </body>
</html>
