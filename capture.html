<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quick Capture</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
      body {
        background: #c0c0c0;
        font: 12px Tahoma, Arial, sans-serif;
        border: 2px solid; border-color: #fff #404040 #404040 #fff;
        outline: 1px solid #000;
        display: flex; flex-direction: column;
      }
      .title { background: #000080; color: #fff; font-weight: bold; padding: 3px 6px; -webkit-app-region: drag; }
      .body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
      .tabs { display: flex; gap: 4px; }
      .tab {
        font: inherit; padding: 2px 10px; background: #c0c0c0; cursor: default;
        border: 2px solid; border-color: #fff #404040 #404040 #fff;
      }
      .tab.on { border-color: #404040 #fff #fff #404040; font-weight: bold; }
      input {
        font: 14px Tahoma, Arial, sans-serif; width: 100%; padding: 4px 6px; user-select: text;
        border: 2px solid; border-color: #404040 #fff #fff #404040; background: #fff;
      }
      .hint { color: #404040; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="title">Quick Capture</div>
    <div class="body">
      <div class="tabs" id="tabs"></div>
      <input id="in" autocomplete="off" spellcheck="false" />
      <input id="in2" autocomplete="off" spellcheck="false" placeholder="Back of the card (the answer)" style="display:none;margin-top:6px" />
      <div class="hint" id="hint"></div>
    </div>
    <script>
      var KINDS = [
        ["task", "Task", "Finish lab report"],
        ["note", "Note", "A quick thought\u2026"],
        ["reminder", "Reminder", "Call mom at 5pm  \u00b7  or: in 30 min"],
        ["event", "Event", "Study group tomorrow at 3pm"],
        ["card", "Card", "Front of the card (copied text goes here)"],
        ["ask", "Ask", "Ask Clipy anything\u2026"],
      ];
      var cur = 0, tabs = document.getElementById("tabs"), inp = document.getElementById("in"), inp2 = document.getElementById("in2");
      function paint() {
        tabs.textContent = "";
        KINDS.forEach(function (k, i) {
          var b = document.createElement("button");
          b.className = "tab" + (i === cur ? " on" : "");
          b.textContent = k[1];
          b.tabIndex = -1;
          b.onmousedown = function (e) { e.preventDefault(); cur = i; paint(); inp.focus(); };
          tabs.append(b);
        });
        inp.placeholder = KINDS[cur][2];
        var card = KINDS[cur][0] === "card";
        inp2.style.display = card ? "" : "none";
        document.getElementById("hint").textContent = card ? "Enter: next / save   Tab: switch type   Esc: cancel" : "Tab: switch type   Enter: save   Esc: cancel";
        window.captureApi.resize(card ? 172 : 126);
      }
      function keys(e) {
        if (e.key === "Tab") {
          e.preventDefault();
          cur = (cur + (e.shiftKey ? KINDS.length - 1 : 1)) % KINDS.length;
          paint();
          (KINDS[cur][0] === "card" && inp.value.trim() ? inp2 : inp).focus();
        } else if (e.key === "Enter") {
          e.preventDefault();
          var t = inp.value.trim();
          if (KINDS[cur][0] === "card") {
            if (!t) { inp.focus(); return; }
            if (e.target === inp && !inp2.value.trim()) { inp2.focus(); return; }
            window.captureApi.submit("card", JSON.stringify({ front: t, back: inp2.value.trim() }));
          } else if (t) window.captureApi.submit(KINDS[cur][0], t);
        } else if (e.key === "Escape") {
          e.preventDefault();
          window.captureApi.cancel();
        }
      }
      inp.addEventListener("keydown", keys);
      inp2.addEventListener("keydown", keys);
      window.captureApi.onInit(function (p) {
        var i = KINDS.map(function (k) { return k[0]; }).indexOf(p && p.kind);
        cur = i >= 0 ? i : 0;
        paint();
        inp.value = (p && p.kind === "card" && p.front) || "";
        inp2.value = "";
        if (p && p.kind === "card" && !p.front) document.getElementById("hint").textContent = "Nothing was copied yet. Copy some text first, or type the front here.";
        (p && p.kind === "card" && p.front ? inp2 : inp).focus();
      });
      paint();
      inp.focus();
    </script>
  </body>
</html>
