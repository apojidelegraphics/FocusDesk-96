<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clipy</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { background: #c0c0c0; font: 13px Tahoma, "Segoe UI", Arial, sans-serif; display: flex; flex-direction: column; padding: 6px; gap: 6px; }
      #log {
        flex: 1; overflow-y: auto; background: #fff; padding: 8px;
        border: 2px solid; border-color: #404040 #fff #fff #404040;
        display: flex; flex-direction: column; gap: 8px;
      }
      .m { max-width: 92%; padding: 6px 9px; white-space: pre-wrap; word-wrap: break-word; border: 1px solid #808080; }
      .me { align-self: flex-end; background: #ffffcc; }
      .bot { align-self: flex-start; background: #e8f0ff; }
      .sys { align-self: center; background: #fff; color: #606060; border-style: dashed; font-size: 12px; }
      .who { display: block; font-weight: bold; font-size: 11px; color: #000080; margin-bottom: 2px; }
      #row { display: flex; gap: 6px; }
      #in {
        flex: 1; font: 14px Tahoma, Arial, sans-serif; padding: 5px 6px;
        border: 2px solid; border-color: #404040 #fff #fff #404040;
      }
      button {
        font: inherit; padding: 3px 12px; background: #c0c0c0; cursor: default;
        border: 2px solid; border-color: #fff #404040 #404040 #fff;
      }
      button:active { border-color: #404040 #fff #fff #404040; }
      button:disabled { color: #808080; }
    </style>
  </head>
  <body>
    <div id="log"></div>
    <div id="row"><input id="in" placeholder="Ask Clipy anything&hellip;" autocomplete="off" /><button id="send">Send</button></div>
    <script>
      var log = document.getElementById("log"), inp = document.getElementById("in"), btn = document.getElementById("send"), busy = false;
      function add(cls, who, text) {
        var d = document.createElement("div"); d.className = "m " + cls;
        if (who) { var w = document.createElement("span"); w.className = "who"; w.textContent = who; d.appendChild(w); }
        d.appendChild(document.createTextNode(text));
        log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
      }
      function ask(text) {
        text = String(text || "").trim();
        if (!text || busy) return;
        inp.value = ""; busy = true; btn.disabled = true;
        add("me", "You", text);
        var typing = add("bot", "Clipy", "typing\u2026");
        window.auxApi.invoke("clipy:ask", { text: text }).then(
          function (r) { typing.remove(); add(r && r.ok ? "bot" : "sys", r && r.ok ? "Clipy" : "", (r && r.text) || "(no reply)"); },
          function () { typing.remove(); add("sys", "", "Clipy couldn't be reached. Is FocusDesk still running?"); }
        ).then(function () { busy = false; btn.disabled = false; inp.focus(); });
      }
      btn.onclick = function () { ask(inp.value); };
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); ask(inp.value); } });
      add("sys", "", "Ask me anything: what's due, how your week went, or just chat.");
      window.auxApi.on("clipy:init", function (p) { if (p && p.question) ask(p.question); inp.focus(); });
      inp.focus();
    </script>
  </body>
</html>
